[unstable]
build-std = ["std"]
json-target-spec = true

[build]
# waterbox-guest.json is the stock x86_64-unknown-linux-musl target with two
# fields changed: has-thread-local = false (below) and disable-redzone = true.
#
# disable-redzone: a guest may be interrupted by a dirty-tracking fault at any
# instruction, and on Windows that exception lands on the guest's own stack,
# where the bytes below rsp do not survive it (miniBox docs/RED-ZONE.md). The C
# cores get -mno-red-zone through the musl-gcc specs; Rust has no such flag,
# the target spec is where LLVM is told. build-std rebuilds std with it too.
# miniBox's check-wbx.sh refuses a guest that still addresses below rsp.
#
# Rust compiles #[thread_local] to %fs-relative loads, and %fs is the one
# per-thread base a host OS does not maintain for us. Windows keeps %gs alive
# because it is the TEB and its own code depends on it, but nothing there uses
# %fs, so the kernel loses it at moments the sandbox never sees - and a guest
# that reads its thread locals through %fs dies at an unrelated instruction
# some seconds later. -Z tls-model=global-dynamic does NOT help: for a static,
# non-PIC build LLVM proves every symbol local and puts the model straight back.
#
# Turning the target's native TLS off instead makes std fall back to its
# key-based implementation, which goes through musl's pthread_getspecific and
# so through [gs:0x18] - the sandbox context slot in the TEB - like every C
# core already does.
target = "waterbox-guest.json"
rustflags = ["-C", "code-model=large", "-C", "relocation-model=static", "-C", "target-feature=+crt-static"]
