cargo-features = ["panic-immediate-abort"]

[package]
name = "ruffle_guest"
version = "0.0.0"
edition = "2021"

[lib]
name = "ruffle_guest"
crate-type = ["staticlib"]

[dependencies]
# ruffle's own wgpu renderer, on a software GL we build ourselves (renderer.rs)
ruffle_render_wgpu = { path = "../../extern/ruffle/render/wgpu" }
ruffle_render = { path = "../../extern/ruffle/render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["gles"] }
# The pinned ruffle checkout (extern/ruffle-pinned-commit.txt); a path dep so
# the guest compiles the same source the native reference does.
ruffle_core = { path = "../../extern/ruffle/core", features = ["audio", "mp3", "aac", "default_font"] }  # the feature set ruffle's own test harness builds with
# exact versions ruffle uses, so the navigator trait's Url/Encoding types match
url = "=2.5.8"
encoding_rs = "=0.8.35"
percent-encoding = "=2.3.2"
async-channel = "=2.5.0"
indexmap = "=2.14.0"
# the settings channel: the engine mounts a flat JSON object as "settings"
serde_json = "=1.0.151"
# ruffle says everything it could not do through `tracing`; without a
# subscriber the guest drops every word of it (see WarnToStderr in lib.rs)
tracing = "=0.1.44"
# the same version ruffle pins: Date is built here, not read from a clock
# the sandbox does not have (see WaterboxLocale in lib.rs)
chrono = { version = "=0.4.44", default-features = false }

[profile.release]
# NOT "immediate-abort": that strategy applied to this crate while std was
# still built to unwind, and the mismatch corrupted thread-local and Arc
# reads once the core did real work (a blank frame, then a fault on a
# pointer that was never a pointer). "abort" is consistent and costs only a
# little size, since nothing here unwinds either way.
panic = "abort"
opt-level = 2
